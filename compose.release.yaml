# Pull-only installation.
services:
  crashguard:
    image: ${CRASHGUARD_IMAGE:?Set a published image version or digest}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${CRASHGUARD_UID:-1000}:${CRASHGUARD_GID:-1000}"
    ports:
      - "${CRASHGUARD_BIND_ADDRESS:-127.0.0.1}:${CRASHGUARD_PORT:-5000}:5000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:5000}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-${APP_URL:-http://localhost:5000}}
      DATABASE_PATH: /app/data/crashguard.sqlite
      INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-120}
      ALERT_WEBHOOK_HOSTS: ${ALERT_WEBHOOK_HOSTS:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - type: bind
        source: ${CRASHGUARD_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
