name: Publish versioned image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Serialize reruns for a version; never interrupt a publication in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'suciudan/crashguard'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Check tag against package and lockfile
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-check.mjs version "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/suciudan/crashguard:${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Refuse to replace an existing version
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-check.mjs available "$IMAGE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/suciudan/crashguard
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Smoke-test the candidate and persistent storage
        env:
          CRASHGUARD_IMAGE: ${{ env.IMAGE }}
        run: node scripts/test-release-image.mjs
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check again after the build. Never rebuild between smoke and push.
          node scripts/release-check.mjs available "$IMAGE"
          docker push "$IMAGE"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '### Published release image (linux/amd64)'
            echo "Version: \`$IMAGE\`"
            echo "Pinned reference: \`ghcr.io/suciudan/crashguard@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
