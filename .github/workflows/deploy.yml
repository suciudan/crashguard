name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'suciudan/crashguard' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.merge.outputs.eligible }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify main was merged into production
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          # Wait briefly for GitHub's PR metadata to reflect the merge.
          for attempt in 1 2 3; do
            eligible=$(gh api --paginate --slurp "repos/$REPOSITORY/commits/$COMMIT/pulls" \
              | jq --arg sha "$COMMIT" --arg repo "$REPOSITORY" -f scripts/production-merge.jq)
            if [[ "$eligible" == true ]]; then break; fi
            if [[ "$attempt" != 3 ]]; then sleep 5; fi
          done
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" != true ]]; then
            echo 'Skipping deployment: this commit is not a merged main-to-production PR.'
          fi

  checks:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/suciudan/crashguard:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/suciudan/crashguard
      - name: Export immutable image reference
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=ghcr.io/suciudan/crashguard@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    # Configure the environment's required reviewer and production-only branch policy
    # in GitHub before registering this runner. Labels alone do not restrict PRs.
    environment:
      name: production
    runs-on: [self-hosted, linux, x64, prod]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      CRASHGUARD_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sign in to the container registry
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/crashguard-docker-${{ github.run_id }}-${{ github.run_attempt }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Back up SQLite and deploy
        # Production values are available only to this approved runtime step.
        # Keep them out of build arguments, job outputs, and deployment URLs.
        env:
          APP_URL: ${{ secrets.PRODUCTION_URL }}
          CRASHGUARD_NATIVE: ${{ secrets.CRASHGUARD_NATIVE || '0' }}
          CRASHGUARD_UID: ${{ secrets.CRASHGUARD_UID || '1000' }}
          CRASHGUARD_GID: ${{ secrets.CRASHGUARD_GID || '1000' }}
          CRASHGUARD_PORT: ${{ secrets.CRASHGUARD_PORT || '5000' }}
          INGEST_RATE_LIMIT: ${{ secrets.INGEST_RATE_LIMIT || '120' }}
          ALERT_WEBHOOK_HOSTS: ${{ secrets.ALERT_WEBHOOK_HOSTS }}
          SYMBOLICATOR_SOURCES: ${{ secrets.SYMBOLICATOR_SOURCES || '[]' }}
        run: bash scripts/deploy.sh
      - name: Remove registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          docker logout ghcr.io || true
          rm -f -- "$DOCKER_CONFIG/config.json"
          rmdir -- "$DOCKER_CONFIG" || true
