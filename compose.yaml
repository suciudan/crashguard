services:
  crashguard:
    image: ${CRASHGUARD_IMAGE:-crashguard:local}
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5000}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${CRASHGUARD_UID:-1000}:${CRASHGUARD_GID:-1000}"
    ports:
      - "${CRASHGUARD_BIND_ADDRESS:-127.0.0.1}:${CRASHGUARD_PORT:-5000}:5000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:5000}
      DATABASE_PATH: /app/data/crashguard.sqlite
      AUTH_ORIGIN: ${AUTH_ORIGIN:-${NEXT_PUBLIC_APP_URL:-http://localhost:5000}}
      INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-120}
      ALERT_WEBHOOK_HOSTS: ${ALERT_WEBHOOK_HOSTS:-}
    volumes:
      # Mount the directory so SQLite's database, WAL, and SHM stay together.
      - type: bind
        source: ${CRASHGUARD_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
