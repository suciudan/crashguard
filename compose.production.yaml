services:
  crashguard:
    image: ${CRASHGUARD_IMAGE:?Set an immutable production image reference}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${CRASHGUARD_UID:-1000}:${CRASHGUARD_GID:-1000}"
    ports:
      - "127.0.0.1:${CRASHGUARD_PORT:-5000}:5000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the public HTTPS origin}
      AUTH_ORIGIN: ${NEXT_PUBLIC_APP_URL}
      DATABASE_PATH: /app/data/crashguard.sqlite
      INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-120}
      ALERT_WEBHOOK_HOSTS: ${ALERT_WEBHOOK_HOSTS:-}
    volumes:
      - type: bind
        source: ${CRASHGUARD_DEPLOY_DIR:-/opt/crashguard}/data
        target: /app/data
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
